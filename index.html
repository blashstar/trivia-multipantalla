<!DOCTYPE html>
<html lang="es" x-data="$aplicacion">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title x-text="titulo">_</title>

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/10up-sanitize.css/13.0.0/sanitize.min.css"
			integrity="sha512-y1dtMcuvtTMJc1yPgEqF0ZjQbhnc/bFhyvIyVNb9Zk5mIGtqVaAB1Ttl28su8AvFMOY0EwRbAe+HCLqj6W7/KA=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<link rel="stylesheet" href="css/base.css" />
		<link rel="stylesheet" href="css/pantalla.css" />
	</head>
	<body>
		<div id="aplicacion">
			<img :src="fondo" :alt="pagina" class="fondo" />

			<div id="cronometro" x-show="pagina=='pregunta'">
				<div
					class="tiempo"
					x-text="Math.ceil(tiempoRestante)"
				></div>
			</div>

			<template x-if="pagina=='#'">
				<section class="pagina" id="ninguna"></section>
			</template>
			<template x-if="pagina=='inicio'">
				<section class="pagina" id="inicio">
					<div class="contenedor">
						<img src="/img/visa-agosto/tarjeta.webp" alt="" width="375">
						<img src="/img/visa-agosto/logo_trivia.svg" alt="" width="876">
					</div>
				</section>
			</template>
			<template x-if="pagina=='espera'">


				<section class="pagina" id="espera">
					<div class="contenedor">
						<div class="contenido">
							<div class="logo-espera-qr">
								<div x-html="invitacion" class="qr"></div>
							</div>
							<hgroup>
								<h2 x-text="textos?.qrTitulo"></h2>
								<h3 x-text="textos?.qrSubtitulo"></h3>
							</hgroup>
						</div>
						<div class="contenido">
							<h4><span x-text="textos?.instruccionesTitulo"></span></h4>
							<h5><span x-text="textos?.bienvenida"></span></h5>

							<div class="textos">
								<p x-text="textos?.instrucciones?.[0]"></p>
								<p><span x-text="textos?.instrucciones?.[1]?.replace('{segundos}', segundos)"></span></p>
								<p x-text="textos?.instrucciones?.[2]"></p>
								<p x-text="textos?.instrucciones?.[3]"></p>
								<p x-text="textos?.instrucciones?.[4]"></p>
							</div>
						</div>
					</div>

				</section>
			</template>
			<template x-if="pagina=='carrera'">
				<section class="pagina" id="carrera">
					<div class="pista">
						<img src="img/pista.png" alt="" class="pista__fondo" />
						<div class="jugadores">
							<template x-for="(jugador, id) in jugadores">
								<div
									class="jugador"
									:class="[
							jugador.etiqueta,
							jugador.sexo,
							avatares[id]?.pose,
							avatares[id]?.avance,
							]"
								></div>
							</template>
						</div>
					</div>
				</section>
			</template>

			<template x-if="pagina=='pregunta'">
				<section class="pagina" id="pregunta">
					<div class="contenedor">
						<div
							class="pregunta"
							x-html="pregunta?.contenido"
						></div>

						<div class="opciones">
							<template
								x-for="(opcion, id) in pregunta?.respuestas"
							>
								<div class="opcion" :class="opcion === respuestaCorrecta ? 'correcta' : ''">
									<span
										class="letra"
										x-text="letra(id).toLowerCase()"
									></span>
									<span class="texto" x-html="opcion"></span>
								</div>
							</template>
						</div>

						<template x-if="respuestaCorrecta">
						</template>
					</div>
				</section>
			</template>
			<template x-if="pagina=='podio'">
				<section id="podio" class="pagina" x-ref="podio">
					<div class="contenedor">
						<div class="trivia_marca">
							<img :src="logos?.principal" :alt="marca?.nombre">
						</div>
						<div class="grupo">
							<div class="titulos">
								<figure>
									<img :src="logos?.decoracion" alt="">
								</figure>
								<div class="titulo" x-text="textos?.ranking">
								</div>
							</div>
							<div class="tabla">
								<div class="tabla-posiciones">
									<div class="tabla-header">
										<span>#</span>
										<span>Jugador</span>
										<span>Pts</span>
									</div>
									<template x-for="(ganador, id) in ganadores" :key="ganador.etiqueta">
										<div
											class="tabla-fila"
											:class="`puesto-${id+1}`"
										>
											<span class="posicion" x-text="id + 1"></span>
											<span class="nombre" x-text="ganador.nombre.toUpperCase()"></span>
											<span class="puntaje" x-text="ganador.puntaje"></span>
										</div>
									</template>
								</div>

							</div>
						</div>

					</div>
					<canvas id="confetti"></canvas>
				</section>
			</template>
			<template x-if="pagina=='puntajes'">
				<section id="puntajes" class="pagina" x-ref="puntajes">
					<div class="contenedor">
						<div class="trivia_marca">
							<img :src="logos?.principal" :alt="marca?.nombre">
						</div>
						<div class="grupo">
							<div class="titulos">
								<figure>
									<img :src="logos?.decoracion" alt="">
								</figure>
								<div class="titulo" x-text="textos?.ranking">
								</div>
							</div>
							<div class="tabla">
								<div class="tabla-posiciones">
									<div class="tabla-header">
										<span>#</span>
										<span>Jugador</span>
										<span>Pts</span>
									</div>
									<template x-for="(ganador, id) in ganadores" :key="ganador.etiqueta">
										<div
											class="tabla-fila"
											:class="`puesto-${id+1}`"
										>
											<span class="posicion" x-text="id + 1"></span>
											<span class="nombre" x-text="ganador.nombre.toUpperCase()"></span>
											<span class="puntaje" x-text="ganador.puntaje"></span>
										</div>
									</template>
								</div>

							</div>
						</div>

					</div>
					<canvas id="confetti"></canvas>
				</section>
			</template>

			<template x-if="pagina!='#'">
			</template>
		</div>
	</body>
	<script>
		window.opcionesJuego = {
			modulo: "pantalla",
		};
	</script>
	<script src="env.js"></script>
	<script type="module">
		import { cargarConfig } from './js/loader.js';
		import { iniciarEscalado } from './js/util/escaler.js';

		await cargarConfig();
		iniciarEscalado();

		await import('./js/index.js');
	</script>
</html>
